name: Bug report
description: Something the framework claims to do, but doesn't
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repo's rules are written as claims with numbers attached ("this gate fires on X",
        "this pattern has a 55% recall"). A useful bug report shows a claim that is false.

        **Do not paste credentials, tokens, or private data.** A prefix and a commit hash
        are enough. If the report is itself sensitive, use
        [SECURITY.md](https://github.com/sqkl520/multi-agent-audit-framework/blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Output of `git rev-parse --short HEAD` in this repo
      placeholder: e.g. f5d6a48
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - A validator in tools/ (check-*.mjs)
        - The stop-hook / phase gating
        - A contract document in framework/
        - A prompt template in framework/templates/
        - The README or other documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What does the contract/doc claim should happen?
      description: Quote the sentence and give its `file:line`. This is the anchor — without it the report can't be evaluated.
      placeholder: |
        framework/components/output-contract/verify.md:184 says:
        "evidence.mutation_check ... 除 harness_unsupported / unsafe_revert 两种情形外强制为 performed"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happens?
      description: Paste the command you ran and its output.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Ideally a shell snippet or a minimal artifact file that triggers it.
        If this needs a target repo, describe the smallest shape of that repo that reproduces it.
      placeholder: |
        node tools/check-payload.mjs /tmp/min.md --role verify
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node --version`), and the harness you run the framework with (if relevant)
      placeholder: e.g. Ubuntu 24.04, Node 20.11, Claude Code / dsh 0.2.1-rc.2
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I ran `node tools/check-all.mjs` and pasted any failure output above
          required: false
        - label: I have removed all credentials and private data from this report
          required: true
