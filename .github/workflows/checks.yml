name: checks

# 这个仓库没有 build 步骤、没有 npm install —— 只有 Node.js 和几十个自测套件。
# 所以 CI 就是「跑一遍 check-all」。它是唯一能区分「规则存在」和「规则被强制执行」的东西。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 是主要目标；windows 也跑，因为框架里有若干处 git 调用在不同平台上行为不同
        # （本轮真的踩过：Windows 上每个 node 进程启动约 1.8s，把某个套件从 11s 拖到 51s）。
        #
        # 下限是 Node 22：几个会话日志校验器用到 `zlib.zstdDecompressSync`，
        # 那是 22.15 才有的 API。最初矩阵里配了 20，结果两个平台都在**模块加载阶段**
        # 就因具名导入不存在而全红——现在代码已改成运行时探测 + 明确报错，
        # 但支持声明仍然从 22 起，不假装能在 20 上工作。
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
        exclude:
          # 只在一个组合上跑两遍没有意义，用一个 linux + 一个 windows 覆盖平台差异即可
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
        with:
          # 2026-11-21：必须放开浅克隆。
          #
          # 默认 fetch-depth: 1 只取一个提交，历史里没有父提交，于是
          # `git log HEAD~1..HEAD` 直接报 "ambiguous argument"。
          # 我第一版就在这里把 CI 弄红了——本地仓库有完整历史，
          # **本地怎么测都测不出来**。
          #
          # 提 PR 时还要能从 base 分支读提交，所以显式取全量。
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Report environment
        run: |
          node --version
          git --version

      - name: Run all mechanical checks
        # 无 npm install：本仓库刻意保持零运行时依赖。
        run: node tools/check-all.mjs

      - name: Bilingual cross-links (PROJECT-RULES rule 6)
        # 规则 6 原文：「缺一边就会出现『点进去回不来』的单向链接。
        # **有 CI 的项目应加一条检查。**」
        #
        # 单独列一步而不只挂在 check-all 里，是为了让失败原因在 Actions 页面
        # 一眼可见——混在 43 个套件的输出里，读者要翻很久才知道是链接坏了。
        run: node tools/check-bilingual-links.mjs

      - name: Commit message format (PROJECT-RULES rule 3.2)
        # 规则 3.2：「type 用这七个，不要自创」。
        #
        # 只查**本次推送范围**，不查历史存量：历史改不了（要 force push，
        # 规则 3.3 禁止），而一道上线首日就红出 8 条的闸门会被立刻关掉。
        #
        # 2026-11-21 第一版在这里把 CI 弄红了：checkout 默认 fetch-depth: 1，
        # `HEAD~1` 不存在，脚本报「配置错误」exit 2。
        # **本地仓库有完整历史，本地怎么测都测不出来。**
        # 现在两处都修了：checkout 取全量 + 脚本在浅克隆下降级而非崩溃。
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "基线: $BASE"
          # 基线存在才限定范围；否则退回「只查 HEAD」，脚本自己会说明降级
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            node tools/check-commit-msg.mjs --since "$BASE"
          else
            echo "基线 $BASE 不可用（浅克隆），降级为只查 HEAD"
            node tools/check-commit-msg.mjs
          fi

      - name: Rule → validator ledger (report only)
        # 仪表，不是闸门：存量规则里绝大多数没有机器出口，这里只打印比例，不判失败。
        # 想知道为什么它不 FAIL，读 tools/check-rule-ledger.mjs 的文件头。
        run: node tools/check-rule-ledger.mjs
        continue-on-error: true

      - name: Secret scan (history)
        # 本仓库发生过一次真实的密钥入库事故（四个 provider key 进了 14 个提交），
        # 后经全历史重写清除。这道检查防止再犯：任何 sk- 形态的长串都会让它变红。
        shell: bash
        run: |
          set -e
          if git log --all -p | grep -oE '\bsk-[A-Za-z0-9_-]{20,}' | grep -v 'REDACTED'; then
            echo "::error::发现疑似 API key 进入 git 历史"
            exit 1
          fi
          echo "✓ git 历史中没有疑似密钥"
