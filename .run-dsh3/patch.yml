- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: audit-upstream
    model: virtual/opus
    reasoningEffort: high
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      audit-upstream:
        displayName: Audit Upstream
        apiKeyEnv: AUDIT_API_KEY
        api: anthropic-messages
        baseURL: http://47.108.197.93:33000
        models:
          - id: virtual/opus
            name: virtual/opus
            contextWindow: 800000
            maxTokens: 16384
            input:
              - text
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high