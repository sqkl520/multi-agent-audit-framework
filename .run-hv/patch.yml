- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: happyapi
    model: virtual/opus
    reasoningEffort: high
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      happyapi:
        displayName: HappyAPI
        apiKeyEnv: HAPPYAPI_API_KEY
        api: openai-completions
        baseURL: http://47.108.197.93:33000/v1
        models:
          - id: virtual/opus
            name: virtual/opus
            contextWindow: 800000
            input:
              - text
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
